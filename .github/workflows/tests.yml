name: Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read
    pull-requests: write

jobs:
    test:
        # The library resolves wall-clock times into instants, so its answers must not depend on
        # where it runs. A UTC-only leg hid that for a long time: the suite passed under TZ=UTC and
        # failed hundreds of cases elsewhere. These four span the sign of the offset, a half-hour
        # offset, and a southern-hemisphere DST calendar.
        name: Test Suite
        runs-on: ubuntu-latest
        # Pinned to UTC deliberately, and that is a gap rather than a decision. The library's
        # answers must not depend on where it runs, but 48 tests still fail under a non-UTC host:
        # the exported date utilities (startOfDay, isSameDay, alignToInterval, getTimeWithinDay)
        # read the host clock by design, and their tests assume it is UTC. Adding the matrix now
        # would mean permanently red checks, which teach people to ignore CI. Add
        # `tz: [UTC, America/New_York, Asia/Kolkata, Pacific/Auckland]` here once those exports are
        # gone — the library code itself is already clock-independent, and a sweep in
        # tests/helpers/time/wall-window.test.ts holds it that way meanwhile.
        env:
            TZ: UTC
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run type check
              run: bun run typecheck

            - name: Run linter
              run: bun run lint

            - name: Build package
              run: bun run build

            - name: Run tests
              run: bun test

            - name: Run tests with coverage
              run: bun run test:coverage

            - name: Upload coverage reports to Codecov
              uses: codecov/codecov-action@v5
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
