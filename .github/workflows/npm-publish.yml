name: Publish to npm

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions:
    id-token: write
    contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node 24 for the npm it bundles: Trusted Publishing exchanges the job's OIDC
      # token for a short-lived npm credential and needs npm >= 11.5.1, which Node 20
      # does not ship. Installing npm@latest on top of Node 20 fails outright, since
      # current npm refuses to run there at all.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install

      - name: Run type checking
        run: bun run typecheck

      - name: Run linting
        run: bun run lint

      - name: Build package
        run: bun run build

      - name: Run tests
        run: bun test

      - name: Publish to npm
        run: npm publish