name: Publish to npm

# A tagged GitHub Release fires both `release: published` and `push: tags`, so the workflow ran
# twice and the loser failed on "version already published". The release is the single trigger;
# the tag it carries is checked against package.json below.
on:
  release:
    types: [published]

permissions:
    id-token: write
    contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node 24 for the npm it bundles: Trusted Publishing exchanges the job's OIDC
      # token for a short-lived npm credential and needs npm >= 11.5.1, which Node 20
      # does not ship. Installing npm@latest on top of Node 20 fails outright, since
      # current npm refuses to run there at all.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install

      - name: Run type checking
        run: bun run typecheck

      - name: Run linting
        run: bun run lint

      - name: Build package
        run: bun run build

      - name: Run tests
        run: bun test

      # Tag and version have drifted apart before — v0.5.0 points at package.json 0.5.1, and 0.5.1
      # reached npm a minute before 0.5.0. A mismatch now fails the release instead of publishing
      # something the tag does not describe.
      - name: Check the tag matches package.json
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Release tag $TAG does not match package.json $VERSION"
            exit 1
          fi
          echo "Tag $TAG matches package.json"

      - name: Publish to npm
        run: npm publish